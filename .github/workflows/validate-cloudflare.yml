name: Validate Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - ".github/workflows/validate-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Worker dry run
        run: npx --yes wrangler@latest deploy --dry-run --config cloudflare/wrangler.toml --outdir /tmp/dispatchos-worker
